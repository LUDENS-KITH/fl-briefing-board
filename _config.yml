# GitHub Pages (Jekyll) : seuls les guides et documents Markdown passent par ici. Le tableau
# (index.html) et les pages de présentation (fr/, en/) n'ont pas d'en-tête YAML : ils sont
# servis tels quels. Ces réglages nourrissent les balises que jekyll-seo-tag écrit dans
# chaque document rendu (titre, description, aperçu de partage).
title: FL Briefing Board
description: >-
  Tableau de briefing gratuit pour escadrons DCS World : symboles aéro, cartes des
  théâtres, coupe liée à la route, vue radar, kneeboard et DTC du F/A-18C.
lang: fr
twitter:
  card: summary_large_image

# Documents de travail : publiés avec le dépôt, mais pas proposés aux moteurs de recherche
# (_includes/head-custom.html écrit la balise robots).
defaults:
  # jekyll-seo-tag ne lit l'image de partage que dans les valeurs de la page : la clé
  # `image` du site seule ne produit aucune balise og:image.
  - scope: { path: "" }
    values: { image: /assets/readme/apercu-social.png }
  - scope: { path: "docs/GUIDE.en-US.md" }
    values: { lang: en-US }
  - scope: { path: "docs/PLAN.md" }
    values: { noindex: true }
  - scope: { path: "docs/ETAT.md" }
    values: { noindex: true }
  - scope: { path: "docs/MODELE.md" }
    values: { noindex: true }
  - scope: { path: "docs/RADAR.md" }
    values: { noindex: true }
  - scope: { path: "docs/DEVELOPPER.md" }
    values: { noindex: true }
  - scope: { path: "docs/VISIBILITE.md" }
    values: { noindex: true }
