<body>
<h1>Banc de saisie</h1>
<p id="sum">en cours…</p>
<ol id="out"></ol>
<div id="host"></div>

<script>
/* Banc de saisie — FL Briefing Board.
   Chaque scénario ouvre l'application neuve dans un cadre, stockage vidé, puis la pilote
   par de vrais PointerEvent et KeyboardEvent, comme un pilote : jamais en appelant le
   moteur. L'état (tool, sel, objs, past, cam…) est lu, jamais écrit.
   À servir en HTTP local depuis la racine du dépôt :
     python -m http.server 8765  →  http://localhost:8765/tools/banc-saisie.html
   Le verdict s'affiche en haut de la page et dans le titre de l'onglet. */

const KEY = 'fl-briefing-board-v3';
/* la langue de l'application jugée : ?lang=en rejoue tout le banc en anglais */
const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
const LANG_KEY = 'fl-briefing-board-lang';
const appUrl = (q = '') => '../index.html?' + (q ? q + '&' : '') + 'lang=' + LANG;
const host = document.getElementById('host');
const BITS = [1, 4, 2];                    // boutons gauche, molette, droit → masque `buttons`

const IDB_NAME = 'fl-briefing-board';      // octets des images de fond
async function open(){                     // application neuve, tableau vide, aucune image gardée
  localStorage.removeItem(KEY);
  localStorage.removeItem(LANG_KEY);
  await new Promise(r => { const q = indexedDB.deleteDatabase(IDB_NAME); q.onsuccess = q.onerror = q.onblocked = () => r(); });
  return reload();
}
async function reload(){                   // relit le stockage, comme une réouverture
  host.innerHTML = '';
  const f = document.createElement('iframe');
  f.src = appUrl();
  host.appendChild(f);
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await pause(50);                         // pas requestAnimationFrame : suspendu dans un onglet masqué
  return app(f);
}
function pause(ms){ return new Promise(r => setTimeout(r, ms)); }

function app(f){
  const w = f.contentWindow, d = w.document, cv = d.getElementById('c');
  const at = (x, y) => { const r = cv.getBoundingClientRect(); return { clientX: r.left + x, clientY: r.top + y }; };
  const pe = (type, x, y, button, buttons) => {
    const ev = new w.PointerEvent(type, { bubbles: true, cancelable: true, composed: true, pointerId: 1,
      pointerType: 'mouse', isPrimary: true, button, buttons, ...at(x, y) });
    cv.dispatchEvent(ev);
    return ev;
  };
  return {
    w, d,
    s: expr => w.eval(expr),                                   // lecture de l'état du moteur
    down: (x, y, b = 0) => pe('pointerdown', x, y, b, BITS[b]),
    move: (x, y, buttons = 1) => pe('pointermove', x, y, -1, buttons),
    chord: (x, y) => pe('pointermove', x, y, 2, 3),            // droit enfoncé pendant un glissé gauche
    up: (x, y, b = 0) => pe('pointerup', x, y, b, 0),
    /* le menu du navigateur : bloqué si l'événement est annulé */
    menu(x, y){
      const ev = new w.MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2, ...at(x, y) });
      cv.dispatchEvent(ev);
      return ev.defaultPrevented;
    },
    click(x, y, b = 0){ this.down(x, y, b); this.up(x, y, b); return b === 2 ? this.menu(x, y) : undefined; },
    drag(x1, y1, x2, y2, b = 0){
      this.down(x1, y1, b);
      for (let i = 1; i <= 6; i++) this.move(x1 + (x2 - x1) * i / 6, y1 + (y2 - y1) * i / 6, BITS[b]);
      this.up(x2, y2, b);
      if (b === 2) this.menu(x2, y2);
    },
    key: (key, o = {}) => d.body.dispatchEvent(new w.KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...o })),
    tile: k => d.querySelector(`.tile[data-k="${k}"]`).click(),
    button: q => d.querySelector(q).click(),
    map(id = 'Caucasus'){ this.choose('#theatre', id); },
    /* une liste déroulante, comme la choisit le pilote : la valeur puis l'événement change */
    choose(q, v){ const s = d.querySelector(q); s.value = v; s.dispatchEvent(new w.Event('change')); },
    toast: () => { const t = d.getElementById('toast'); return t && !t.hidden ? t.textContent : ''; },
    /* une image PNG fabriquée dans le cadre, comme un fichier du poste */
    png(name, wd, ht){
      const c = d.createElement('canvas'); c.width = wd; c.height = ht;
      const g = c.getContext('2d'); g.fillStyle = '#c33'; g.fillRect(0, 0, wd, ht);
      return new Promise(r => c.toBlob(b => r(new w.File([b], name, { type:'image/png' })), 'image/png'));
    },
    /* un fichier lâché sur la page, ou choisi par le bouton Ouvrir */
    drop(file){
      const dt = new w.DataTransfer(); dt.items.add(file);
      d.body.dispatchEvent(new w.DragEvent('drop', { dataTransfer: dt, bubbles: true, cancelable: true }));
    },
    openFile(file){ this.pick('openfile', file); },
    /* un fichier choisi dans la boîte de dialogue d'un champ <input type="file"> */
    pick(id, file){
      const i = d.getElementById(id), dt = new w.DataTransfer(); dt.items.add(file);
      i.files = dt.files; i.dispatchEvent(new w.Event('change'));
    },
    /* le téléchargement intercepté : son nom et son texte */
    async saved(){
      const got = []; w.download = (url, name) => got.push({ url, name });
      this.button('#save'); await pause(400);
      return got.length ? { name: got[0].name, text: await (await w.fetch(got[0].url)).text() } : null;
    },
    json: (obj, name = 'briefing.json') => new w.File([JSON.stringify(obj)], name, { type:'application/json' }),
    /* une vraie archive zip, entrées stockées : ce qu'est une .miz */
    miz(name, files){
      const enc = new w.TextEncoder(), parts = [], dir = [];
      const u16 = v => [v & 255, v >> 8], u32 = v => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255];
      let off = 0;
      for (const [fn, text] of files){
        const nm = enc.encode(fn), data = enc.encode(text);
        const loc = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
                                    ...u32(0), ...u32(data.length), ...u32(data.length), ...u16(nm.length), ...u16(0)]);
        dir.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
                                 ...u32(0), ...u32(data.length), ...u32(data.length), ...u16(nm.length), ...u16(0), ...u16(0),
                                 ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
        parts.push(loc, nm, data);
        off += loc.length + nm.length + data.length;
      }
      const size = dir.reduce((t, b) => t + b.length, 0);
      const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length),
                                  ...u32(size), ...u32(off), ...u16(0)]);
      return new w.File([...parts, ...dir, end], name);
    },
  };
}

/* ---------- scénarios ----------
   `nr` : non-régression — déjà vrai avant le lot, doit le rester. Les autres doivent
   échouer sur le code d'avant le lot : sinon ils ne prouvent rien. */
const T = [];
const test = (nom, fn, nr = false) => T.push({ nom, fn, nr });

test('Ouverture : outil Sélection, un clic dans le vide ne pose rien', async (ok) => {
  const a = await open();
  a.click(400, 300);
  ok(a.s('objs.length') === 0, `objets posés : ${a.s('objs.length')}`);
  ok(a.s('tool') === 'select', `outil à l'ouverture : ${a.s('tool')}`);
  ok(!a.d.querySelector('.tile.on'), 'une vignette de la palette est allumée');
  ok(a.d.querySelector('[data-tool="select"]').classList.contains('on'), 'bouton Sélection éteint');
});

test('Forme choisie, clic droit sans bouger, sans carte : retour à la sélection', async (ok) => {
  const a = await open();
  a.tile('fighter');
  const blocked = a.click(400, 300, 2);
  ok(a.s('objs.length') === 0, `objets posés : ${a.s('objs.length')}`);
  ok(a.s('tool') === 'select', `outil : ${a.s('tool')}`);
  ok(blocked, 'le menu du navigateur s\'ouvre');
});

test('Forme choisie, clic droit sans bouger, sur une carte : retour à la sélection, la carte reste', async (ok) => {
  const a = await open();
  a.map(); a.tile('fighter');
  const cam0 = a.s('JSON.stringify(cam)');
  const blocked = a.click(400, 300, 2);
  ok(a.s('tool') === 'select', `outil : ${a.s('tool')}`);
  ok(a.s('objs.length') === 0, `objets posés : ${a.s('objs.length')}`);
  ok(a.s('JSON.stringify(cam)') === cam0, 'la carte a bougé');
  ok(blocked, 'le menu du navigateur s\'ouvre');
});

test('Sur une carte, clic droit glissé : la carte bouge, l\'outil ne change pas', async (ok) => {
  const a = await open();
  a.map(); a.tile('fighter');
  const x0 = a.s('cam.x');
  a.drag(400, 300, 520, 360, 2);
  ok(a.s('cam.x') !== x0, 'la carte n\'a pas bougé');
  ok(a.s('tool') === 'sym', `outil : ${a.s('tool')}`);
  ok(a.s('objs.length') === 0, `objets posés : ${a.s('objs.length')}`);
}, true);

test('Clic molette sans carte : rien n\'est posé', async (ok) => {
  const a = await open();
  a.tile('fighter');
  a.click(400, 300, 1);
  ok(a.s('objs.length') === 0, `objets posés : ${a.s('objs.length')}`);
});

test('Pose en cours, clic droit : la pose est annulée, retour à la sélection', async (ok) => {
  const a = await open();
  a.tile('fighter');
  a.down(400, 300); a.move(440, 300); a.chord(440, 300); a.up(440, 300); a.menu(440, 300);
  ok(a.s('objs.length') === 0, `objets restants : ${a.s('objs.length')}`);
  ok(a.s('past.length') === 0, `entrées d'historique : ${a.s('past.length')}`);
  ok(a.s('tool') === 'select', `outil : ${a.s('tool')}`);
});

test('Zone en cours, clic droit : zone abandonnée, sans trace dans l\'historique', async (ok) => {
  const a = await open();
  a.key('z');
  a.click(200, 200); a.click(360, 200); a.click(360, 340);
  ok(a.s('draft && draft.pts.length') === 3, `zone en cours : ${a.s('draft && draft.pts.length')} sommets`);
  a.click(300, 260, 2);
  ok(a.s('draft') === null, 'la zone est toujours en cours');
  ok(a.s('objs.length') === 0, `objets : ${a.s('objs.length')}`);
  ok(a.s('past.length') === 0, `entrées d'historique : ${a.s('past.length')}`);
  ok(a.s('tool') === 'select', `outil : ${a.s('tool')}`);
});

test('Échap avec une forme choisie : retour à la sélection', async (ok) => {
  const a = await open();
  a.tile('fighter');
  a.key('Escape');
  ok(a.s('tool') === 'select', `outil : ${a.s('tool')}`);
  a.click(400, 300);
  ok(a.s('objs.length') === 0, `objets posés : ${a.s('objs.length')}`);
});

test('Échap pendant une zone : zone abandonnée, retour à la sélection', async (ok) => {
  const a = await open();
  a.key('z');
  a.click(200, 200); a.click(360, 200); a.click(360, 340);
  a.key('Escape');
  ok(a.s('draft') === null, 'la zone est toujours en cours');
  ok(a.s('past.length') === 0, `entrées d'historique : ${a.s('past.length')}`);
  ok(a.s('tool') === 'select', `outil : ${a.s('tool')}`);
});

test('Forme ancrée, forme choisie, clic dessus : une nouvelle forme se pose par-dessus', async (ok) => {
  const a = await open();
  a.tile('sam'); a.click(400, 300);
  const pos = a.s('JSON.stringify([objs[0].x, objs[0].y])');
  a.key('v'); a.click(400, 300); a.key('k');
  ok(a.s('!!objs[0].locked'), 'le SAM n\'est pas ancré');
  a.tile('fighter'); a.click(400, 300);
  ok(a.s('objs.length') === 2, `objets : ${a.s('objs.length')}`);
  ok(a.s('JSON.stringify([objs[0].x, objs[0].y])') === pos, 'le SAM a bougé');
  ok(a.s('objs[objs.length - 1].k') === 'fighter', 'la forme posée n\'est pas un chasseur');
});

test('Forme ancrée : ni déplacée, ni tournée, ni gommée, ni supprimée ; libérée, tout revient', async (ok) => {
  const a = await open();
  a.tile('sam'); a.click(400, 300);
  a.key('v'); a.click(400, 300);
  const h = JSON.parse(a.s('JSON.stringify(handleList(toScreen(sel))[0])'));
  const geo = () => a.s('JSON.stringify([objs[0].x, objs[0].y, objs[0].a, objs[0].s])');
  a.key('k');
  const g0 = geo();
  a.drag(400, 300, 480, 360);
  ok(geo() === g0, 'déplacée en glissant');
  a.key('v'); a.click(400, 300);
  a.drag(h.x, h.y, h.x + 60, h.y + 20);
  ok(geo() === g0, 'tournée par la poignée');
  a.key('v'); a.click(400, 300);
  a.key('ArrowRight');
  ok(geo() === g0, 'tournée au clavier');
  a.key('Delete');
  ok(a.s('objs.length') === 1, 'supprimée par Suppr');
  ok(/ancr|pin/i.test(a.toast()), `refus muet (message : « ${a.toast()} »)`);
  a.key('e'); a.click(400, 300);
  ok(a.s('objs.length') === 1, 'effacée à la gomme');
  a.key('v'); a.click(400, 300); a.key('k');
  ok(a.s('!objs[0].locked'), 'toujours ancrée après K');
  a.drag(400, 300, 480, 360);
  ok(a.s('objs[0].x') === 480, `libérée mais pas déplacée (x = ${a.s('objs[0].x')})`);
  a.key('Delete');
  ok(a.s('objs.length') === 0, 'libérée mais pas supprimée');
});

test('Ancrage annulable, rétabli, et relu après réouverture', async (ok) => {
  let a = await open();
  a.tile('fighter'); a.click(400, 300);
  a.key('v'); a.click(400, 300); a.key('k');
  ok(a.s('!!objs[0].locked'), 'pas ancrée');
  a.key('z', { ctrlKey: true });
  ok(a.s('!objs[0].locked'), 'Ctrl+Z ne libère pas');
  a.key('y', { ctrlKey: true });
  ok(a.s('!!objs[0].locked'), 'Ctrl+Y ne rétablit pas l\'ancrage');
  a = await reload();
  ok(a.s('objs.length === 1 && !!objs[0].locked'), 'ancrage perdu à la réouverture');
});

test('Zone ancrée sur une carte : glisser dessus à l\'outil Sélection déplace la carte', async (ok) => {
  const a = await open();
  a.map();
  a.key('z');
  a.click(300, 200); a.click(520, 200); a.click(520, 420); a.click(300, 420); a.key('Enter');
  ok(a.s('objs.length === 1 && objs[0].t') === 'zone', 'zone non créée');
  a.key('v'); a.click(410, 310); a.key('k');
  ok(a.s('!!objs[0].locked'), 'zone non ancrée');
  const pts = a.s('JSON.stringify(objs[0].pts)'), x0 = a.s('cam.x');
  a.drag(410, 310, 470, 350);
  ok(a.s('JSON.stringify(objs[0].pts)') === pts, 'la zone a bougé sur le terrain');
  ok(a.s('cam.x') !== x0, 'la carte n\'a pas bougé');
});

test('Sous une forme ancrée, une forme libre se saisit à l\'outil Sélection', async (ok) => {
  const a = await open();
  a.tile('fighter'); a.click(400, 300);                 // chasseur libre
  a.tile('sam'); a.click(440, 300);                     // SAM au-dessus, son anneau couvre le chasseur
  a.key('v'); a.click(470, 300); a.key('k');
  ok(a.s('objs[1].k === "sam" && !!objs[1].locked'), 'SAM non ancré');
  const sam = a.s('JSON.stringify([objs[1].x, objs[1].y])');
  a.drag(400, 300, 400, 380);
  ok(a.s('objs[0].y') === 380, `chasseur non déplacé (y = ${a.s('objs[0].y')})`);
  ok(a.s('JSON.stringify([objs[1].x, objs[1].y])') === sam, 'le SAM a bougé');
});

test('Exports PNG et kneeboard : rien ne marque l\'objet ancré sélectionné', async (ok) => {
  const a = await open();
  a.tile('sam'); a.click(400, 300);
  a.key('v'); a.click(400, 300); a.key('k');
  const got = [];
  a.w.download = url => got.push(url);                 // intercepte le téléchargement
  a.button('#png'); a.button('#knee'); await pause(300);
  a.key('Escape');
  a.button('#png'); a.button('#knee'); await pause(300);
  ok(got.length === 4, `exports interceptés : ${got.length}`);
  ok(got[0] === got[2], 'le PNG diffère selon la sélection');
  ok(got[1] === got[3], 'le kneeboard diffère selon la sélection');
}, true);

test('Écran radar : posé dessous, une forme choisie se pose dessus sans le saisir', async (ok) => {
  const a = await open();
  a.tile('fa18_hafu_h'); a.click(300, 200);             // une piste posée avant l'écran
  a.tile('fa18_tws'); a.click(520, 360);
  ok(a.s('objs.length === 2 && objs[0].k') === 'fa18_tws', `ordre : ${a.s('objs.map(o => o.k).join()')}`);
  const pos = a.s('JSON.stringify([objs[0].x, objs[0].y])');
  a.tile('fa18_brick'); a.click(520, 360);
  ok(a.s('objs.length') === 3, `objets : ${a.s('objs.length')}`);
  ok(a.s('JSON.stringify([objs[0].x, objs[0].y])') === pos, 'l\'écran a bougé');
});

test('Écran radar : ↑ ↓ changent l\'échelle, ← → l\'azimut, annulables', async (ok) => {
  const a = await open();
  a.tile('fa18_rws'); a.click(520, 360);
  a.key('v'); a.click(520, 360);
  ok(a.s('sel && sel.k') === 'fa18_rws', 'écran non sélectionné');
  a.key('ArrowUp');
  ok(a.s('objs[0].rng') === 80, `échelle après ↑ : ${a.s('objs[0].rng')}`);
  a.key('ArrowDown'); a.key('ArrowDown');
  ok(a.s('objs[0].rng') === 20, `échelle après ↓ ↓ : ${a.s('objs[0].rng')}`);
  a.key('ArrowLeft');
  ok(a.s('objs[0].az') === 80, `azimut après ← : ${a.s('objs[0].az')}`);
  a.key('z', { ctrlKey: true });
  ok(a.s('objs[0].az === undefined && objs[0].rng') === 20, `après Ctrl+Z : az ${a.s('objs[0].az')}, échelle ${a.s('objs[0].rng')}`);
});

test('Piste HAFU : le geste de pose oriente la tige, la taille et la couleur d\'identité restent', async (ok) => {
  const a = await open();
  a.tile('fa18_hafu_h'); a.drag(400, 300, 400, 390);
  ok(Math.abs(a.s('objs[0].a') - Math.PI) < .05, `cap de la tige : ${a.s('objs[0].a')}`);
  ok(a.s('objs[0].s === SHAPES.fa18_hafu_h.s0'), `taille : ${a.s('objs[0].s')}`);
  ok(a.s('objs[0].c') === '#FF4D4D', `couleur : ${a.s('objs[0].c')}`);
});

test('Écran radar : se saisit par son coin à l\'outil Sélection, sa poignée l\'agrandit', async (ok) => {
  const a = await open();
  a.tile('fa18_rws'); a.click(520, 360);
  const r = a.s('SIZE * objs[0].s');
  a.key('v'); a.click(520 + r * .95, 360 - r * .95);
  ok(a.s('sel === objs[0]'), 'coin de l\'écran non saisi');
  const h = JSON.parse(a.s('JSON.stringify(handleList(toScreen(sel))[0] || null)'));
  ok(h, 'aucune poignée');
  if (h) a.drag(h.x, h.y, h.x + 40, h.y - 40);
  ok(a.s('objs[0].s > SHAPES.fa18_rws.s0'), `taille après la poignée : ${a.s('objs[0].s')}`);
});

test('L&S et DT2 se posent sur une piste HAFU, une seule de chaque par planche', async (ok) => {
  const a = await open();
  a.tile('fa18_hafu_h'); a.click(400, 300);
  a.tile('fa18_hafu_u'); a.click(560, 300);
  a.tile('fa18_ls'); a.click(400, 300);
  ok(a.s('objs.length') === 2, `objets : ${a.s('objs.length')}`);
  ok(a.s('objs[0].mark') === 'ls', `marque de la 1re piste : ${a.s('objs[0].mark')}`);
  ok(a.s('JSON.stringify([objs[0].x, objs[0].y])') === '[400,300]', 'la piste a bougé');
  a.click(560, 300);
  ok(a.s('!objs[0].mark && objs[1].mark') === 'ls', 'deux L&S sur la planche');
  a.tile('fa18_dt2'); a.click(400, 300);
  ok(a.s('objs[0].mark') === 'dt2', `DT2 : ${a.s('objs[0].mark')}`);
  /* hors d'une piste, la DT2 désigne un nouvel écho : une piste inconnue qui la porte
     (v1.9.1 ; avant, un refus) */

/* la mission choisie comme support par le bouton ⇩ DTC ; le .miz rendu, intercepté et lu */
async function dtc(a, file){
  const got = []; a.w.download = (url, name) => got.push({ url, name });
  a.button('#dtc');
  if (file) a.pick('dtcfile', file);
  await pause(700);
  if (!got.length) return null;
  const MIZ = a.s('MIZ');                                   // une constante du script : lue dans le cadre
  const bytes = new Uint8Array(await (await a.w.fetch(got[0].url)).arrayBuffer()), get = await MIZ.unzip(bytes);
  const mission = MIZ.parseLua(await get('mission')), units = mission.coalition.blue.country[1].plane.group[1].units;
  const name = units[1].DTC && MIZ.list(units[1].DTC.Cartridges).find(c => c.default).name;
  const cart = name && JSON.parse(await get(`DTC/${name}.dtc`));
  return { name: got[0].name, cart, units };
}

/* ---------- lot 10 : accrocher un symbole à un autre ----------
   L'orbite (hippodrome) est posée par un glissé vers le haut : cap 0, taille ≈ 3. Le
   ravitailleur est posé à l'écart puis glissé sur la branche du haut, à l'outil Sélection :
   avec une forme choisie, toucher l'orbite la saisirait au lieu de poser. */
const ORB = [500, 350], BRANCH = [520, 307];
async function orbitTanker(a, { map = false } = {}){
  if (map) a.map();
  a.tile('orbit'); a.drag(ORB[0], ORB[1], ORB[0], ORB[1] - 150);
  a.tile('tanker'); a.click(800, 520);
  a.key('v'); a.drag(800, 520, BRANCH[0], BRANCH[1]);
  await pause(450);
}
/* l'écart du ravitailleur à l'orbite, en pixels écran, tel que le voit le pilote */
const GAP = `(() => { const t = objs.find(o => o.k === 'tanker'), b = objs.find(o => o.k === 'orbit');
  const p = w2s(t.x, t.y), q = w2s(b.x, b.y); return JSON.stringify([p[0] - q[0], p[1] - q[1]]); })()`;
const gap = a => JSON.parse(a.s(GAP));
const same = (p, q, tol = .5) => Math.abs(p[0] - q[0]) <= tol && Math.abs(p[1] - q[1]) <= tol;
const fmt = p => p.map(v => v.toFixed(1)).join(', ');
const hooked = (a, k = 'tanker') => a.s(`(() => { const o = objs.find(o => o.k === '${k}'); return !!(o && o.hook && objs.some(h => h.uid === o.hook.to)); })()`);
/* sélectionner le ravitailleur, 🔗, toucher l'orbite par son bord gauche, loin du ravitailleur */
function hookTanker(a){ a.key('v'); a.click(...BRANCH); a.key('j'); a.click(ORB[0] - 60, ORB[1]); }
async function zoomSteps(a, key, n){ for (let i = 0; i < n; i++) a.key(key); await pause(450); }

test('Accroche, carte : non accroché, le ravitailleur quitte l\'orbite au zoom (le constat)', async (ok) => {
  const a = await open();
  await orbitTanker(a, { map: true });
  const g0 = gap(a);
  await zoomSteps(a, '-', 2);
  ok(!same(gap(a), g0, 2), `écart inchangé au dézoom (${fmt(g0)} → ${fmt(gap(a))}) : le témoin ne voit plus le défaut`);
}, true);

/* ---------- lot 16 : langue de l'interface ----------
   Ces scénarios choisissent eux-mêmes la langue de l'application, quel que soit ?lang
   du banc. Un texte resté en français se reconnaît à ses accents, à ses petits mots, ou
   parce qu'il est une clé du dictionnaire qui avait une traduction. */
async function openIn(lang, q = ''){
  await open();
  host.innerHTML = '';
  const f = document.createElement('iframe');
  f.src = '../index.html?' + (q ? q + '&' : '') + 'lang=' + lang;
  host.appendChild(f);
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await pause(50);
  return app(f);
}
/* tout ce que le pilote peut lire : textes (panneaux fermés compris), info-bulles, titre */
function screenTexts(a){
  const d = a.d, out = new Set(), walk = d.createTreeWalker(d.body, 4);
  for (let n; (n = walk.nextNode());){
    if (n.parentElement.closest('script, style, noscript')) continue;
    const t = n.textContent.replace(/\s+/g, ' ').trim();
    if (t) out.add(t);
  }
  for (const e of d.body.querySelectorAll('[title], [placeholder], [alt], [aria-label]'))
    for (const at of ['title', 'placeholder', 'alt', 'aria-label']){
      const v = (e.getAttribute(at) || '').replace(/\s+/g, ' ').trim();
      if (v) out.add(v);
    }
  out.add(d.title);
  return [...out];
}
const FR_MARK = /[àâçéèêëîïôûùüœ]|\b(le|la|les|des|du|une|et|pour|avec|sur|dans|sans|puis|ou|pas)\b/;
function frenchIn(a, list){
  const EN = a.s('EN'), own = k => Object.prototype.hasOwnProperty.call(EN, k);
  return [...new Set(list)].filter(s => (own(s) && EN[s] !== s) || FR_MARK.test(s));
}
const cite = list => list.slice(0, 8).map(s => '« ' + s.slice(0, 70) + ' »').join(' · ');

  ok(said.length >= 5, `messages entendus : ${said.length} — ${cite(said)}`);
  const left = frenchIn(a, said);
  ok(!left.length, `${left.length} messages en français : ${cite(left)}`);
});

test('Langue : le bouton de langue bascule l\'interface, garde le choix et le travail en cours', async (ok) => {
  let a = await openIn('fr');
  garnir(a);
  const f = host.querySelector('iframe');
  ok(a.d.getElementById('lang').textContent.trim() === 'EN', `bouton en français : « ${a.d.getElementById('lang').textContent} »`);
  let loaded = new Promise(r => f.addEventListener('load', r, { once: true }));
  a.button('#lang'); await loaded; await pause(50);
  a = app(f);
  ok(a.d.documentElement.lang === 'en', `après bascule, <html lang> : ${a.d.documentElement.lang}`);
  ok(a.s('objs.length') === 1, `objets après bascule : ${a.s('objs.length')}`);
  ok(localStorage.getItem(LANG_KEY) === 'en', `choix gardé : ${localStorage.getItem(LANG_KEY)}`);
  ok(a.d.getElementById('lang').textContent.trim() === 'FR', `bouton en anglais : « ${a.d.getElementById('lang').textContent} »`);
  /* rouverte sans ?lang, l'application reprend la langue choisie */
  host.innerHTML = '';
  const g = document.createElement('iframe'); g.src = '../index.html'; host.appendChild(g);
  await new Promise(r => g.addEventListener('load', r, { once: true })); await pause(50);
  a = app(g);
  ok(a.d.documentElement.lang === 'en', `réouverte sans ?lang : ${a.d.documentElement.lang}`);
  loaded = new Promise(r => g.addEventListener('load', r, { once: true }));
  a.button('#lang'); await loaded; await pause(50);
  ok(app(g).d.documentElement.lang === 'fr' && localStorage.getItem(LANG_KEY) === 'fr', 'le retour au français ne prend pas');
});

(async () => {
  const out = document.getElementById('out'), sum = document.getElementById('sum');
  /* le cache HTTP servirait au cadre la version d'avant la modification : le banc
     aurait alors jugé l'ancien code. On recharge la page et chaque script à l'adresse
     exacte qu'elle cite, paramètre de version compris (board.js?v=…). */
  const page = await (await fetch('../index.html', { cache: 'reload' })).text();
  for (const m of page.matchAll(/<script[^>]*\ssrc="([^"]+)"/g)) await fetch('../' + m[1], { cache: 'reload' });
  const res = [];
  for (const t of T){
    const fails = [];
    try { await t.fn((cond, msg) => { if (!cond) fails.push(msg); }); }
    catch (e){ fails.push('erreur : ' + e.message); }
    res.push({ nom: t.nom, nr: t.nr, ok: !fails.length, fails });
    const li = document.createElement('li');
    li.className = fails.length ? 'ko' : 'ok';
    li.textContent = (fails.length ? '✗ ' : '✓ ') + t.nom + (fails.length ? ' — ' + fails.join(' · ') : '');
    if (t.nr){ const s = document.createElement('span'); s.className = 'nr'; s.textContent = ' (non-régression)'; li.appendChild(s); }
    out.appendChild(li);
  }
  host.innerHTML = '';
  localStorage.removeItem(KEY);
  indexedDB.deleteDatabase(IDB_NAME);
  const n = res.filter(r => r.ok).length;
  sum.textContent = n === res.length ? `OK ${n}/${res.length}` : `ÉCHEC ${res.length - n}/${res.length}`;
  sum.className = n === res.length ? 'ok' : 'ko';
  document.title = sum.textContent + ' — banc de saisie';
  window.__banc = res;
})();
